<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Статичные мета-теги — для соцсетей и мессенджеров, которые не выполняют JS.
         После загрузки RouteMeta подставляет заголовок/описание текущей страницы и языка.
         Домен в ссылках ниже подставляется при сборке из SITE_URL в vite.config.ts. -->
    <title>CaspianCoast — жилые комплексы и строительство в Актау</title>
    <meta name="description" content="CaspianCoast — девелопер жилых комплексов на побережье Каспийского моря в Актау. Квартиры в новостройках, проекты ЖК Ilan Towers, Taras, Caspian Coast.">
    <link rel="canonical" href="%VITE_SITE_URL%/">
    <meta name="theme-color" content="#112830">

    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">

    <!-- Open Graph / соцсети -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="CaspianCoast">
    <meta property="og:title" content="CaspianCoast — жилые комплексы и строительство в Актау">
    <meta property="og:description" content="Девелопер жилых комплексов на побережье Каспийского моря. Квартиры в новостройках Актау.">
    <meta property="og:url" content="%VITE_SITE_URL%/">
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="ru_RU">
    <meta property="og:locale:alternate" content="kk_KZ">
    <meta property="og:locale:alternate" content="en_US">
    <meta name="twitter:card" content="summary_large_image">

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "RealEstateAgent",
        "name": "CaspianCoast",
        "url": "%VITE_SITE_URL%/",
        "logo": "%VITE_SITE_URL%/icon-512.png",
        "image": "%VITE_SITE_URL%/og-image.jpg",
        "telephone": "+77006363631",
        "email": "caspiancoast@list.ru",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Business Center Nesibek-Nur, 16 - 22/1",
          "addressLocality": "Aktau",
          "addressCountry": "KZ"
        },
        "sameAs": ["https://www.instagram.com/caspiancoast.kz"]
      }
    </script>

    <!-- Preload critical resources -->
    <!-- Должен совпадать с srcSet/sizes в home-wrapper/Hero.tsx -->
    <link rel="preload" as="image" href="/images/hero-1280.webp" imagesrcset="/images/hero-768.webp 768w, /images/hero-1280.webp 1280w, /images/hero-1920.webp 1920w" imagesizes="100vw" fetchpriority="high">
    <link rel="dns-prefetch" href="https://images.pexels.com">
    <link rel="dns-prefetch" href="https://kuula.co">
    
    <!-- Brand font: Manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Снимает старый service worker; вынесено в файл, чтобы CSP обходился без unsafe-inline -->
    <script src="/sw-cleanup.js"></script>
  </body>
</html>
